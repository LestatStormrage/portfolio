						<div class="header__menu menu">
							<button type="button" data-fls-menu="" class="menu__icon icon-menu">
								<span></span>
							</button>
							<nav class="menu__body">
								<div class="menu__block">
									<ul class="menu__list">
										<li class="menu__item">
											<a href="/" class="menu__link">
												<span class="menu__link-decor">o</span>
												<span data-i18n="menu.link.home">Home</span>
												<span class="menu__link-decor">i</span>
											</a>
										</li>

<fetch url="@components/layout/menu/menu.json">

</fetch>
-->

							<div class="header__language-dropdown dropdown">
								<div class="dropdown__button-wrapper">
									<button class="dropdown__button" id="dropdown-btn" type="button"></button>
								</div>
								<ul class="dropdown__content" id="dropdown-content"></ul>
							</div>
							<div data-fls-darklite-set="" data-fls-dynamic=".menu__block, 991.98, 1" class="header__theme-switcher">

			<main class="page">

						<div class="legal-disclosure__bg-image legal-disclosure__bg-image--light"></div>
					</div>
					<div class="legal-disclosure__fireflies">
						<div data-fls-fireflies="" class="fireflies firefly--1"></div>
						<div data-fls-fireflies="" class="fireflies firefly--2"></div>
						<div data-fls-fireflies="" class="fireflies firefly--3"></div>
					</div>
					<h1 class="legal-disclosure__title" data-i18n="legal-disclosure.title">Legal Disclosure</h1>
					<div class="legal-disclosure__body">
						<div class="legal-disclosure__content">
							<p>
								<span class="legal-disclosure__name" data-i18n="legal-disclosure.name">Name:</span>
								<span class="legal-disclosure__value" data-i18n="legal-disclosure.name-value">Ivan Dinarin</span>
							</p>
							<p>

								<span class="legal-disclosure__value" data-i18n="legal-disclosure.address-value">Vienweg 13, 13127 Berlin, Germany</span>
							</p>
							<p>

								<span class="legal-disclosure__value" data-i18n="legal-disclosure.email-value">stormrageweb@gmail.com</span>

							<span class="dot dot-1"></span>
							<span class="dot dot-2"></span>
							<span class="dot dot-3"></span>

							<span class="dot dot-5"></span>
							<span class="dot dot-6"></span>

							<span class="button__decor button__decor--left">n</span>
							<span class="button__text" data-i18n="footer.back-to-top">Back to top</span>
							<span class="button__decor button__decor--right">k</span>
